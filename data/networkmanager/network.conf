# DebION network settings (debion-network-check).
[network]
# Repair the network automatically: at every boot
# (debion-network-repair.service), when debion-desktop-base is installed or
# upgraded, and when the SDE panel finds after login that names (DNS) cannot
# be resolved. Only safe changes are made (see
# /usr/share/doc/sde/TROUBLESHOOTING.md); false turns all of it off.
auto_repair=true
