# Installed by debion-desktop-base into /usr/lib/NetworkManager/conf.d/.
#
# Debian's NetworkManager has connectivity checking off unless the optional
# network-manager-config-connectivity-debian package is installed. Without it
# NetworkManager cannot tell "connected to the access point" from "connected
# to the internet", so the panel cannot warn about a captive portal, a missing
# default route or broken DNS. This uses the same Debian endpoint as that
# package. To turn checking off (or use another server), put an override in
# /etc/NetworkManager/conf.d/, for example:
#   [connectivity]
#   enabled=false
[connectivity]
uri=http://network-test.debian.org/nm
interval=300
