# SDE: which AppImages may run (sde-appimage, docs/APPIMAGE.md).
#
# policy=verified-only  only AppImages with a valid signature run; the others
#                       can be deleted or kept, never run (the default)
# policy=ask            AppImages without a signature (or of the old type 1)
#                       may also run, after a warning, once the user chose
#                       "Run Anyway"; a bad signature or a changed key never
#                       runs
policy=verified-only
