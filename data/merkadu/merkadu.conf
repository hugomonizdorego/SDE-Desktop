# SPDX-License-Identifier: GPL-3.0-or-later
# Merkadu, the SDE software center: defaults.
#
# Installed as /usr/share/merkadu/merkadu.conf. Distributions and
# administrators change any key in /etc/merkadu/merkadu.conf (or in
# $XDG_CONFIG_DIRS/merkadu/merkadu.conf, e.g. /etc/xdg/merkadu); a key there
# replaces the same key below. See docs/MERKADU.md.
#
# Apps are named by their AppStream id (org.gimp.GIMP), which finds them in
# every source, or by deb:PACKAGE, flatpak:APPID or snap:NAME; alternatives
# separated by '|' are tried in order (Debian and Flathub do not always use
# the same id: where they differ, the distribution's package comes first).
# Names that are in no catalog are skipped, so a list can name apps of
# sources a computer does not have. Lists are separated by ';'.

[Highlights]
# The banner of the Home page (the first app found) and the Highlights.
apps=org.gimp.GIMP;org.inkscape.Inkscape;org.kde.krita;deb:blender|org.blender.Blender;org.kde.kdenlive;com.obsproject.Studio;org.audacityteam.Audacity;org.videolan.VLC;deb:libreoffice-writer|org.libreoffice.LibreOffice;deb:firefox-esr|org.mozilla.firefox|deb:firefox;deb:thunderbird|org.mozilla.Thunderbird;org.gnome.Shotwell

[Popular]
# "Popular Apps": well-known free software. Ubuntu Software Center ranked by
# the ratings of its review server, which no longer exists; this list is
# chosen by the distribution instead.
apps=deb:firefox-esr|org.mozilla.firefox|deb:firefox;deb:thunderbird|org.mozilla.Thunderbird;deb:libreoffice-writer|org.libreoffice.LibreOffice;org.videolan.VLC;org.gimp.GIMP;com.obsproject.Studio;org.audacityteam.Audacity;org.inkscape.Inkscape;org.kde.kdenlive;org.keepassxc.KeePassXC;org.qbittorrent.qBittorrent;org.shotcut.Shotcut

[Recommended]
# "Recommended for You": well-known apps of a department (its id: the name
# in lower case, "&" and spaces as "-"), shown to people who have apps of
# that department and do not have these yet. Nothing leaves the computer.
graphics=org.gimp.GIMP;org.inkscape.Inkscape;org.kde.krita;deb:blender|org.blender.Blender;org.darktable.Darktable;org.gnome.Shotwell;org.kde.digikam
sound-video=org.videolan.VLC;org.audacityteam.Audacity;com.obsproject.Studio;org.kde.kdenlive;org.shotcut.Shotcut;fr.handbrake.ghb;io.mpv.Mpv;org.gnome.Rhythmbox3
internet=deb:firefox-esr|org.mozilla.firefox|deb:firefox;deb:thunderbird|org.mozilla.Thunderbird;deb:chromium|org.chromium.Chromium;org.qbittorrent.qBittorrent;org.telegram.desktop;im.pidgin.Pidgin;com.transmissionbt.Transmission
office=deb:libreoffice-writer|org.libreoffice.LibreOffice;org.gnome.Evince;org.kde.okular;com.github.jeromerobert.pdfarranger;org.gnucash.GnuCash;com.github.xournalpp.xournalpp;com.calibre_ebook.calibre
education=org.kde.gcompris;org.tuxpaint.Tuxpaint;edu.mit.Scratch;org.stellarium.Stellarium;org.kde.marble;org.geogebra.GeoGebra
science-engineering=org.stellarium.Stellarium;org.qgis.qgis;org.kicad.KiCad;org.freecad.FreeCAD|org.freecadweb.FreeCAD;org.octave.Octave;org.kde.kalzium
games=net.supertuxkart.SuperTuxKart;net.supertux.SuperTux;com.play0ad.zeroad;org.wesnoth.Wesnoth;org.luanti.luanti|net.minetest.Minetest;org.gnome.Chess
developer-tools=com.vscodium.codium;org.geany.Geany;org.kde.kate;org.gnome.Builder;org.gnome.meld
accessories=org.keepassxc.KeePassXC;com.github.tchx84.Flatseal;org.gnome.Calculator;deb:kdeconnect|org.kde.kdeconnect.app
books-magazines=com.calibre_ebook.calibre;com.github.johnfactotum.Foliate

[New]
# "New & Updated": the apps with the most recent releases in their AppStream
# metadata, not installed yet. How many to show (0 hides the row).
count=12

[Refresh]
# Merkadu refreshes the software lists (the package lists with the archive's
# AppStream catalog, the Flatpak remotes' catalogs) when it starts, in the
# background; lists younger than min-age minutes are not downloaded again.
# The Refresh button always refreshes.
on-start=true
min-age=30

[Sources]
# Which source an app is installed from when it is in several (the user can
# choose another one on its page): debian (the distribution's packages,
# through PackageKit), flatpak (Flathub and other remotes) and snap.
order=debian;flatpak;snap

[Flatpak]
# Flathub is set up when Merkadu is installed (from
# /usr/share/merkadu/flathub.flatpakrepo); "false" here leaves it out (the
# package's setup reads /etc/merkadu/merkadu.conf) and hides the offer to
# set it up.
setup-flathub=true
# The repository file "Set Up Flathub" uses when the one Merkadu ships is
# missing.
flathub-url=https://dl.flathub.org/repo/flathub.flatpakrepo

[Snap]
# snapd keeps each user's snap data in ~/snap. Merkadu asks snapd to use the
# hidden ~/.snap/data instead (snap set system
# experimental.hidden-snap-folder=true) before it installs the first snap.
hide-home-folder=true

[Uninstall]
# Packages that Merkadu never removes, besides sde, sde-desktop and merkadu
# (the desktop itself) and what the system needs (Essential and required
# packages, the running kernel). Removing an app that would take one of them
# away is refused with an explanation.
protected=
