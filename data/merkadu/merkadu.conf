# Merkadu, the SDE software center: defaults.
#
# Installed as /usr/share/merkadu/merkadu.conf. Distributions and
# administrators change any key in /etc/merkadu/merkadu.conf (or in
# $XDG_CONFIG_DIRS/merkadu/merkadu.conf, e.g. /etc/xdg/merkadu); keys there
# replace the ones below, section by section. See docs/MERKADU.md.
#
# Apps are named by their AppStream id (org.gimp.GIMP), which finds them in
# every source, or by deb:PACKAGE, flatpak:APPID or snap:NAME. Names that are
# in no catalog are skipped. Lists are separated by ';'.

[Featured]
# The banner of the Explore page and the Featured row, in this order.
apps=org.inkscape.Inkscape;org.gimp.GIMP;org.blender.Blender;org.kde.krita;org.audacityteam.Audacity;org.stellarium.Stellarium;net.supertuxkart.SuperTuxKart;com.calibre_ebook.calibre;org.tuxpaint.Tuxpaint;org.videolan.VLC

[Top]
# "Top Apps": popular free software. Ubuntu Software Center ranked by the
# ratings of its review server, which no longer exists; this list is chosen
# by the distribution instead.
apps=org.mozilla.firefox;org.libreoffice.LibreOffice;org.mozilla.Thunderbird;org.videolan.VLC;com.obsproject.Studio;org.kde.kdenlive;org.gimp.GIMP;org.inkscape.Inkscape;org.audacityteam.Audacity;org.shotcut.Shotcut;org.qbittorrent.qBittorrent;org.keepassxc.KeePassXC

[New]
# "New & Updated": the apps with the most recent releases in their AppStream
# metadata, not installed yet. How many to show (0 hides the row).
count=12

[Sources]
# Which source an app is installed from when it is in several (the user can
# choose another one on its page): debian (the distribution's packages,
# through PackageKit), flatpak (Flathub and other remotes) and snap.
order=debian;flatpak;snap

[Flatpak]
# Offered by "Add Flathub" when the system installation has no Flathub remote.
flathub-url=https://dl.flathub.org/repo/flathub.flatpakrepo

[Snap]
# snapd keeps each user's snap data in ~/snap. Merkadu asks snapd to use the
# hidden ~/.snap/data instead (snap set system
# experimental.hidden-snap-folder=true) before it installs the first snap.
hide-home-folder=true

[Uninstall]
# Packages that Merkadu never removes, besides sde, sde-desktop and merkadu
# (the desktop itself). Removing an app that would take one of them away is
# refused with an explanation.
protected=
