# SDE Welcome: the window.
#
# Distributions: copy this file to /etc/SDE-Welcome/welcome.conf and keep
# only the keys you change; that file wins and survives upgrades of SDE.
# The tiles are the files in steps/. README in this folder and
# /usr/share/doc/sde/WELCOME.md describe everything.

[Welcome]
# %OS% is the name of the system (NAME in /etc/os-release).
Title=Welcome to %OS%
Subtitle=A few first steps to make this computer yours.
# An icon name, or an image file: absolute, or relative to this folder
# (icons/logo.svg). Empty: LOGO from /etc/os-release.
Logo=
# "Desktop: Selviana Desktop Environment <version>" under the title.
ShowDesktopLine=true
# Window size in pixels at 100 % scale, and columns of tiles.
Width=720
Height=540
Columns=2
# These English texts use SDE's translations. Texts of your own carry their
# translations as Title[id]=..., Subtitle[pt_BR]=...
X-SDE-Gettext-Domain=sde
