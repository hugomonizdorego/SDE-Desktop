# SDE compositor fallback defaults (picom). The session normally generates
# ~/.config/sde/aero-compositor*.conf from sde.conf instead (see [compositor]).
# This file is the "lite" profile: XRender, small shadows, no blur or fades,
# so it is smooth on VMs and software rendering too; windows keep the soft
# corners of the SDE themes (SDE Graphite's 10 px).
backend = "xrender";
vsync = true;
# Repaint only damaged areas (big win for XRender).
use-damage = true;
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.16;
shadow-offset-x = -3;
shadow-offset-y = -3;
fading = false;
corner-radius = 10;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "window_type = 'tooltip'", "window_type = 'dropdown_menu'", "window_type = 'popup_menu'", "window_type = 'menu'", "fullscreen"];
unredir-if-possible = false;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'SDE Panel'"];
