# SDE compositor alpha defaults (picom backend). No blur, fades or rounded masks.
backend = "xrender";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 8;
shadow-opacity = 0.16;
shadow-offset-x = -3;
shadow-offset-y = -3;
fading = false;
corner-radius = 0;
unredir-if-possible = false;
shadow-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'SDE Panel'"];
