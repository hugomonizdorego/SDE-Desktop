# Selviana Desktop Environment - system defaults.
#
# Installed as /etc/xdg/sde/sde.conf. Users override any key in
# ~/.config/sde/sde.conf (sde-settings writes that file for you).

[appearance]
# Theme family, installed in /usr/share/themes:
#   sde          SDE Light / SDE Dark (flat)
#   aero         SDE Aero (glass bars, default)
#   liquid-glass SDE Liquid Glass (frosted, rounded)
# Without the key, SDE uses aero, or sde when [aero] enabled=false.
#style=aero
# light or dark
theme=light
# Turns off effects, blur and transparency on older computers.
low_resource=false
# Accent color used for selections and highlights.
accent=#2672BE
# Icon theme name, or "auto" to use the best installed theme.
icon_theme=auto
font=Sans
font_size=10
# Interface size in percent (100, 125, 150, 175, 200) or "auto" (from Xft.dpi).
scale=auto
# Path to an image, or "auto" for the Selviana wallpaper.
wallpaper=auto
# zoom, fit, stretch, center or tile
wallpaper_mode=zoom

[aero]
# Glass for SDE Aero and SDE Liquid Glass: translucent panel, menus and
# window frames with blur (SDE Light/Dark stay opaque).
# The compositor must be running ([compositor] mode=auto).
enabled=true
# Transparency in percent, 0 (opaque) to 60.
transparency=18
blur=true
# Blur strength, 1 (light) to 12 (strong).
blur_strength=6
rounded_corners=true
# Fade windows and menus in and out.
animations=true

[menu]
# Right-click the Start menu to change these.
# top or bottom
search_position=top
# left, right or hidden
categories=left
# list or grid
view=list
show_descriptions=true
# small, medium or large
size=medium

[effects]
# auto enables menu animations on computers with 4 GB memory and 4 CPU
# threads (Eduka-Desktop's rule); true or false forces them.
enabled=auto
# none, wave, glow, slide, pop or bounce
hover=pop
# none, zoom, zoom-out, ripple, bounce, bubbles, confetti or fade
launch=zoom
# slow, normal or fast; small, normal or large
speed=normal
size=normal
random=false

[panel]
# full, floating or short (centered); widths are percentages of the monitor.
style=full
width_percent=96
# bottom or top
position=bottom
height=40
autohide=false
clock_24h=true
show_date=true
# A thin Show Desktop strip next to the Action Center button (Super+D works always).
show_desktop_button=false
show_battery=true
show_keyboard=true
show_bluetooth=true
# A power button in the tray (the Action Center and Start menu also have one).
show_power=false
# Shown while a USB drive or memory card is plugged in / while Do Not Disturb is on.
show_drives=true
show_do_not_disturb=true
show_media=true
show_network=true
show_sound=true
show_tray=true
# Applets that keep running as agents but would repeat a native indicator
# (network, Bluetooth, battery, volume). Matched against SNI Id/Title and the
# XEmbed WM_CLASS. Set hide_duplicate_tray=false to show them anyway.
hide_duplicate_tray=true
duplicate_tray_items=nm-applet;blueman;blueman-applet;sde-power-manager;mate-power-manager;pasystray;volumeicon;cbatticon;nm-tray
# Applications pinned to the panel (desktop file IDs). Missing ones are skipped.
pinned=org.mozilla.firefox.desktop;firefox.desktop;firefox-esr.desktop;chromium.desktop;liria.desktop;niny.desktop;sde-settings.desktop

[desktop]
# small, medium or large
icon_size=medium
# name, size, type or modified
sort=name
show_icons=true
show_home=true
show_trash=false

[suite]
# auto uses SDE Aero (or Adwaita when Aero is disabled) and follows SDE's
# light/dark mode in newly launched GTK suite processes.
# system keeps the system GTK theme. An explicit GTK_THEME always wins.
gtk_theme=auto

[action_center]
show_clock=true
clock_style=digital
show_greeting=true
multicolor=false
# Move system indicators and tray into Action Center while it is open.
move_status=true
show_media=true
show_app_volume=true
show_microphone=true
show_tray=true
# SDE defaults to two columns; three provides a denser layout.
tile_columns=2

[notifications]
do_not_disturb=false
# Seconds a notification stays on screen; 0 keeps it until dismissed.
timeout=6

[input]
# Keyboard layout codes from XKB, e.g. us, id, de. Empty keeps the system setting.
keyboard_layout=
keyboard_layout2=
repeat_delay=500
repeat_rate=30
# -100 (slow) to 100 (fast)
mouse_speed=0
mouse_natural_scroll=false
touchpad_tap=true
touchpad_natural_scroll=true
touchpad_disable_while_typing=true
touchpad_speed=0

[session]
# Window manager command. sde-wm is built from Openbox source for SDE.
window_manager=sde-wm
# Polkit authentication agent command, "auto" or "none".
polkit_agent=auto

[compositor]
# off disables compositing; auto starts the optional supervised SDE compositor.
mode=auto
# auto uses OpenGL (glx) on real hardware with a DRM graphics device, and
# xrender (without blur) in virtual machines or without one. Alt+Shift+F12
# turns the compositor off or on.
backend=auto
