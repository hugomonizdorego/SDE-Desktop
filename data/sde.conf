# Selviana Desktop Environment - system defaults.
#
# Installed as /etc/xdg/sde/sde.conf. Users override any key in
# ~/.config/sde/sde.conf (sde-settings writes that file for you).

[appearance]
# light or dark
theme=light
# Accent color used for selections and highlights.
accent=#167D9A
# Icon theme name, or "auto" to use the best installed theme.
icon_theme=Papirus
font=Sans
font_size=10
# Interface size in percent (100, 125, 150, 175, 200) or "auto" (from Xft.dpi).
scale=auto
# Path to an image, or "auto" for the Selviana wallpaper.
wallpaper=auto
# zoom, fit, stretch, center or tile
wallpaper_mode=zoom

[panel]
# full, floating or short (centered); widths are percentages of the monitor.
style=full
width_percent=96
# bottom or top
position=bottom
height=40
autohide=false
clock_24h=true
show_date=true
show_battery=true
show_keyboard=true
show_bluetooth=true
show_power=true
show_media=true
# Media indicator appears only while a player is available.
show_network=true
show_sound=true
# Ordinary app icons stay in the panel when space permits. Click the clock
# for Action Center, including the tray when indicators are collapsed.
show_tray=true
# Applications pinned to the panel (desktop file IDs). Missing ones are skipped.
pinned=firefox.desktop;liria.desktop;niny.desktop;sde-settings.desktop

[desktop]
# small, medium or large
icon_size=medium
# name, size, type or modified
sort=name
show_icons=true
show_home=true
show_trash=false

[suite]
# auto follows SDE's light/dark mode in newly launched GTK suite processes.
# system keeps the system GTK theme. An explicit GTK_THEME always wins.
gtk_theme=auto

[action_center]
show_clock=true
clock_style=digital
show_greeting=true
multicolor=false
# Move system indicators and tray into Action Center while it is open.
move_status=true
show_media=true
show_app_volume=true
show_microphone=true
show_tray=true
# SDE defaults to two columns; three provides a denser layout.
tile_columns=2

[notifications]
do_not_disturb=false
# Seconds a notification stays on screen; 0 keeps it until dismissed.
timeout=6

[input]
# Keyboard layout codes from XKB, e.g. us, id, de. Empty keeps the system setting.
keyboard_layout=
keyboard_layout2=
repeat_delay=500
repeat_rate=30
# -100 (slow) to 100 (fast)
mouse_speed=0
mouse_natural_scroll=false
touchpad_tap=true
touchpad_natural_scroll=true
touchpad_disable_while_typing=true
touchpad_speed=0

[session]
# Window manager command. sde-wm is built from Openbox source for SDE.
window_manager=sde-wm
# Polkit authentication agent command, "auto" or "none".
polkit_agent=auto

[compositor]
# off disables compositing; auto starts the optional supervised SDE compositor.
mode=auto
