# Selviana Desktop Environment - system defaults.
#
# Installed as /etc/xdg/sde/sde.conf. Users override any key in
# ~/.config/sde/sde.conf (sde-settings writes that file for you).

[appearance]
# light or dark
theme=light
# Accent color used for selections and highlights.
accent=#167D9A
# Icon theme name, or "auto" to use the best installed theme.
icon_theme=auto
font=Sans
font_size=10
# Path to an image, or "auto" for the Selviana wallpaper.
wallpaper=auto
# zoom, fit, stretch, center or tile
wallpaper_mode=zoom

[panel]
height=40
clock_24h=true
show_date=true
show_battery=true
# Applications pinned to the panel (desktop file IDs). Missing ones are skipped.
pinned=org.mozilla.firefox.desktop;firefox.desktop;firefox-esr.desktop;chromium.desktop;pcmanfm.desktop;org.gnome.Nautilus.desktop;thunar.desktop;nemo.desktop;sde-settings.desktop

[desktop]
show_icons=true
show_home=true
show_trash=false

[session]
# Window manager command, or "openbox" for the SDE-configured Openbox.
window_manager=openbox
# Polkit authentication agent command, "auto" or "none".
polkit_agent=auto
