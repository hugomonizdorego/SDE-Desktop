# Selviana Desktop Environment - system defaults.
#
# Installed as /etc/xdg/sde/sde.conf. Users override any key in
# ~/.config/sde/sde.conf (sde-settings writes that file for you).

[appearance]
# Theme family, built into /usr/share/themes as SDE-<Family>-<Mode>-<Accent>
# (GTK 3, GTK 4, libadwaita colors and SDE WM frames all follow it):
#   graphite  SDE Graphite: calm, soft depth, after Apple's HIG (default;
#             based on the Graphite GTK theme by Vince Liu)
#   fluent    SDE Fluent: Mica and Acrylic, after the Fluent Design System
#             (based on Flat Remix by Daniel Ruiz de Alegria)
#   glass     SDE Glass: frosted and rounded (was SDE Aero / Liquid Glass)
# Values of older releases are mapped: sde -> graphite, aero -> fluent,
# liquid-glass -> glass.
style=graphite
# light, dark or auto (light from 07:00 to 19:00)
theme=light
# Turns off effects, blur and transparency on older computers.
low_resource=false
# Accent: accent_name is one of blue, teal, green, yellow, orange, red, pink,
# purple or graphite; accent is its color (#RRGGBB). A color of your own in
# accent (without accent_name) is used by SDE, and GTK uses the nearest one.
#accent_name=blue
accent=#3684DD
# Icon theme name, or "auto": Papirus (Papirus-Dark in dark mode) when it is
# installed, otherwise the best installed theme.
icon_theme=auto
font=Sans
font_size=10
# Interface size in percent (75, 100, 125, 150, 175, 200) or "auto" (from
# Xft.dpi, at least 100).
scale=auto
# Path to an image (JPEG, PNG, SVG, or WebP when gdk-pixbuf can read it), or
# "auto" for the Selviana wallpaper that follows light and dark mode.
wallpaper=auto
# zoom, fit, stretch, center or tile
wallpaper_mode=zoom

[aero]
# Translucency: Acrylic/vibrancy for the panel and menus of every family;
# SDE Glass also makes window frames translucent and adds blur.
# The compositor must be running ([compositor] mode=auto).
enabled=true
# Transparency and clarity, 0 (opaque) to 100: the panel, menus, Start menu,
# Action Center, popups, window frames and GTK menus of every family. 100 is
# the most each surface can be while text keeps WCAG contrast over any
# background. Presets in Settings: Off 0, Subtle 25, Clear 50, Glass 80. On
# the lite compositor profile (virtual machines, software rendering) there is
# no blur and surfaces stay more opaque.
transparency=25
blur=true
# Blur strength, 1 (light) to 12 (strong).
blur_strength=6
rounded_corners=true
# Fade windows and menus in and out.
animations=true

[menu]
# The Start menu: a rail (account, Documents, Pictures, Gallery, Settings,
# and Power off, which asks first; lock, sleep, restart and log out are in
# the Action Center's footer), the
# applications A-Z with a category filter, and pinned applications as tiles.
# Right-click the menu to change these. Drag its outer edge to resize it;
# the size is kept in width/height (unscaled pixels).
#width=680
#height=620
# small, medium or large: the size before the menu is resized by hand.
size=medium
# "Recently added" (installed in the last two weeks) and "Most used" (ranked
# by how often and how recently they were opened, kept in
# ~/.local/state/sde/menu-usage) above the list.
show_recently_added=true
show_most_used=true
# Tile groups: "Name,app.desktop:m,other.desktop:w;Next group,..." with the
# sizes s(mall), m(edium), w(ide) and l(arge); a folder of tiles is
# "folder:Name/a.desktop/b.desktop:m". Unset: favorites made of the
# installed applications and the default applications, in the groups Work,
# Photos and media and System (or the favorites of older SDE versions in
# those groups). Drag tiles and applications into groups, onto another tile
# for a folder, drop them on empty space for a new group; click a group name
# to rename it, drag it to move the group; right-click a tile, a folder or a
# group name for more. See docs/START-MENU.md.
#tiles=
# 3 since 0.2 Alpha 3 (folders). Below 3, the default groups of older
# versions (Productivity and Explore; 0.2 Alpha 2's groups by category, as
# long as they were not arranged) give way to the favorites.
#tiles_version=3
# The pinned applications as a flat list, kept for older SDE versions.
#favorites=

[effects]
# auto enables menu animations on computers with 4 GB memory and 4 CPU
# threads (Eduka-Desktop's rule); true or false forces them.
enabled=auto
# none, wave, glow, slide, pop or bounce
hover=pop
# none, zoom, zoom-out, ripple, bounce, bubbles, confetti or fade
launch=zoom
# slow, normal or fast; small, normal or large
speed=normal
size=normal
random=false

[panel]
# Search next to the Start button: box ("Type here to search"), icon or
# hidden; auto is a box on the full panel and an icon on the short and
# floating ones. Typing in the Start menu also searches.
search=auto
# full, floating or short (centered); widths are percentages of the monitor.
style=full
width_percent=96
# bottom or top
position=bottom
height=40
autohide=false
clock_24h=true
show_date=true
# A thin Show Desktop strip at the far end of the panel (Super+D works always).
show_desktop_button=true
show_battery=true
# What follows the battery icon: icon (nothing), percent, label ("Charging",
# "On battery", "Full", ...) or label-percent; battery_time=true puts the
# estimate in the label ("3 h 57 min left", "1 h 10 min to full").
# battery_animation=auto animates charging and a low battery unless effects
# are off (Effects page, low resource mode); true or false decide.
battery_display=icon
battery_time=false
battery_animation=auto
show_keyboard=true
show_bluetooth=true
# A power button in the tray (the Action Center and Start menu also have one).
show_power=false
# Shown while a USB drive or memory card is plugged in / while Do Not Disturb is on.
show_drives=true
show_do_not_disturb=true
# Media players are controlled from the Action Center; the panel shows no
# media icon (alpha50). Kept for compatibility, ignored.
show_media=false
show_network=true
# A small LED on the network icon: green internet, yellow local network only
# (no internet), red not connected. network_led_blink=false keeps it steady
# (it is steady on battery saver anyway).
network_led=true
network_led_blink=true
# One keyboard indicator: auto shows an input method's own icon (IBus,
# Fcitx) instead of SDE's layout indicator when one runs; sde always keeps
# SDE's. XKB layout applets (gxkb, xxkb...) are hidden next to SDE's.
keyboard_indicator=auto
# Touchpad indicator: auto (when a touchpad exists; animates while hovered
# and for 2 s after use), always (follows every movement) or never.
touchpad_indicator=auto
show_touchpad=true
show_sound=true
show_tray=true
# Application tray icons sit directly on the panel while there are at most
# tray_overflow_threshold of them and they fit; more gather behind the ^
# overflow button. tray_overflow: auto, always or never.
tray_overflow=auto
tray_overflow_threshold=4
# Applets that keep running as agents but would repeat a native indicator
# (network, Bluetooth, battery, volume). Matched against SNI Id/Title and the
# XEmbed WM_CLASS. Set hide_duplicate_tray=false to show them anyway.
hide_duplicate_tray=true
duplicate_tray_items=nm-applet;blueman;blueman-applet;pasystray;volumeicon;cbatticon;nm-tray;udiskie
# Applications pinned to the panel (desktop file IDs). Missing ones are skipped.
pinned=org.mozilla.firefox.desktop;firefox.desktop;firefox-esr.desktop;chromium.desktop;liria.desktop;niny.desktop;sde-settings.desktop

[drives]
# USB drives, memory cards and external disks (UDisks2): mount a new drive
# at once (like GNOME and Cinnamon) and announce it with Open / Eject.
automount=true
notify=true

[desktop]
# small, medium or large
icon_size=medium
# name, size, type or modified
sort=name
show_icons=true
show_computer=false
show_home=true
show_trash=false

[suite]
# auto uses the SDE theme chosen in Settings (SDE-Graphite-Light-Blue, ...)
# and follows SDE's light/dark mode and accent in GTK suite processes.
# system keeps the system GTK theme. An explicit GTK_THEME always wins.
gtk_theme=auto

[action_center]
show_clock=true
# The clock on the panel and in the Action Center: digital, led or analog.
# Seconds and the blinking colon are options of their own: [panel]
# clock_seconds and clock_blink (true or false).
clock_style=digital
show_greeting=true
multicolor=false
# The tray flyout (the ^ icon) gathers the panel's tray icons while it is open.
move_status=true
# Expanded shows media, calendar and notifications; false keeps tiles and
# sliders only. The header button of the Action Center switches it.
expanded=true
show_calendar=true
show_notifications=true
show_media=true
show_app_volume=true
show_microphone=true
show_tray=true
# Quick tiles per row: 4 (default) or 3.
tile_columns=4
# The brightness slider shows while a backlight can be controlled; without
# one, an external monitor through DDC/CI when ddcutil is installed
# ([brightness] external_monitor; this older key is its fallback).
external_brightness=true

[clock]
# Automatic time zone: the panel detects the time zone of the network
# (ipapi.co / ip-api.com, like the weather) and sets it with timedatectl at
# login and when the network changes, at most once an hour. The Sync button
# under the Action Center's calendar does it on demand.
auto_timezone=false

[weather]
# An animated sky behind the Action Center's clock with the temperature,
# condition and place of the current weather, shown only while online.
# Weather from Open-Meteo (api.open-meteo.com, no account or key); the
# result is cached in ~/.cache/sde/weather.json.
enabled=true
# auto: located by IP address (ipapi.co, then ip-api.com); "lat,lon" in
# decimal degrees (e.g. -6.2,106.8); or a place name, looked up with
# geocoding-api.open-meteo.com (e.g. Jakarta).
location=auto
# auto (Fahrenheit for en_US and the other locales that use it), celsius
# or fahrenheit.
unit=auto
# Minutes a report is reused before it is fetched again (10 to 180).
cache_minutes=25
# auto animates only while the Action Center is open, and not with
# [appearance] low_resource=true or [aero] animations=false; false shows a
# still picture (reduced motion). fps: frames per second (10 to 30).
animation=auto
fps=24

[brightness]
# Set from the gear at the end of the Action Center's brightness row.
# Brightness of an external monitor through DDC/CI (needs ddcutil).
external_monitor=true
# Auto-dim on battery switches [power] idle_dim_battery between 0 and these
# seconds (sde-power dims to [power] dim_level).
auto_dim_battery=true
auto_dim_seconds=120

[night_light]
# Warmer screen colors in the evening (XRandR gamma, applied by the panel).
enabled=false
# 2500 (warm) to 6500 K (neutral).
temperature=4000
# sunset (sunset to sunrise at the weather location, else 19:00-07:00),
# always, or custom (from/to below, HH:MM).
schedule=sunset
from=20:00
to=07:00

[notifications]
do_not_disturb=false
# Seconds a notification stays on screen; 0 keeps it until dismissed.
timeout=6

[input]
# Keyboard layout codes from XKB, e.g. us, id, de. Empty keeps the system setting.
keyboard_layout=
keyboard_layout2=
repeat_delay=500
repeat_rate=30
# -100 (slow) to 100 (fast)
mouse_speed=0
mouse_natural_scroll=false
touchpad_tap=true
touchpad_natural_scroll=true
touchpad_disable_while_typing=true
touchpad_speed=0

[session]
# Window manager command. sde-wm is built from Openbox source for SDE.
window_manager=sde-wm
# Polkit authentication agent command, "auto" or "none".
polkit_agent=auto

[compositor]
# off disables compositing; auto starts the optional supervised SDE compositor.
mode=auto
# auto uses OpenGL (glx) on a real GPU, and xrender in virtual machines,
# with software rendering (llvmpipe) or without a DRM graphics device.
# Alt+Shift+F12 turns the compositor off or on.
backend=auto
# auto: full effects (blur, rounded corners, fades) on a real GPU, lite
# (shadows and translucency only) in VMs and with software rendering, and
# full when backend is set by hand. full or lite force a profile.
effects=auto
# vsync and unredirecting fullscreen windows default to on for a real GPU
# and off in VMs/software rendering. Uncomment to force:
#vsync=true
#unredirect_fullscreen=true

[update]
# Software Updater background checks (sde-update --notifier, started at
# login). Hours between checks: 0 (never), 1, 6, 12, 24 or 168. Nothing is
# ever installed automatically.
check_interval=24
# Refresh the package lists through PackageKit before each check.
auto_refresh=true
# Show a notification when updates are available (only critical and
# security updates with notify_security_only).
notify=true
notify_security_only=false
# Remind Me Later silences the notification for 1, 4, 24, 72 or 168 hours.
remind_hours=24

[power]
# SDE Power (sde-power --daemon). Idle timeouts in seconds, 0 = never,
# separately on battery and when plugged in (AC). Programs that inhibit
# the screen saver (videos, presentations) pause them.
idle_dim_battery=120
idle_blank_battery=300
idle_suspend_battery=900
idle_dim_ac=300
idle_blank_ac=600
idle_suspend_ac=0
# Brightness while dimmed, in percent of the current brightness.
dim_level=30
# Lid on battery / on AC, and the power button:
#   suspend, hibernate, lock, blank (screen off), nothing, poweroff,
#   interactive (power button only: ask), logind (leave it to systemd-logind)
lid_battery=suspend
lid_ac=suspend
power_button=interactive
# Battery warnings (percent) and the critical action:
# hibernate (shuts down when hibernation is unavailable), suspend, poweroff, nothing
notify_battery=true
battery_low=10
battery_critical=5
critical_action=hibernate
# power-profiles-daemon mode on battery / on AC (power-saver, balanced,
# performance); empty leaves the mode alone.
profile_battery=
profile_ac=
# Brightness keys: step in percent and the on-screen display.
brightness_step=5
show_osd=true

[lock]
# SDE Screen Lock (sde-lock --daemon). Lock after this many idle seconds
# (0 = never), unless a program inhibits the screen saver.
idle_lock=300
# Lock before suspend and hibernate (logind delay inhibitor).
lock_on_suspend=true
# Turn the monitors off after this many seconds on the lock screen (0 = never).
blank_after=30
# "Switch User" button with LightDM (dm-tool).
show_switch_user=true

[welcome]
# Open SDE Welcome (sde-welcome) at every login; its "Show this dialog at
# startup" check box writes this key. Since 0.1.0~alpha51 it opens at the
# first login of each user anyway (stamp ~/.config/sde/welcome-done) and
# never in the live session of the ISO.
show=false

[applications]
# Terminal emulator for "Open Terminal Here" and Terminal=true launchers:
# auto (x-terminal-emulator, then the usual terminals) or the desktop file
# ID of a terminal, as chosen in Settings > Default Applications.
# The other default applications live in ~/.config/mimeapps.list.
terminal=auto
