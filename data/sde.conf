# Selviana Desktop Environment - system defaults.
#
# Installed as /etc/xdg/sde/sde.conf. Users override any key in
# ~/.config/sde/sde.conf (sde-settings writes that file for you).

[appearance]
# Theme family, built into /usr/share/themes as SDE-<Family>-<Mode>-<Accent>
# (GTK 3, GTK 4, libadwaita colors and SDE WM frames all follow it):
#   graphite  SDE Graphite: calm, soft depth, after Apple's HIG (default;
#             based on the Graphite GTK theme by Vince Liu)
#   fluent    SDE Fluent: Mica and Acrylic, after the Fluent Design System
#             (based on Flat Remix by Daniel Ruiz de Alegria)
#   glass     SDE Glass: frosted and rounded (was SDE Aero / Liquid Glass)
# Values of older releases are mapped: sde -> graphite, aero -> fluent,
# liquid-glass -> glass.
style=graphite
# light, dark or auto (light from 07:00 to 19:00)
theme=light
# Turns off effects, blur and transparency on older computers.
low_resource=false
# Accent: accent_name is one of blue, teal, green, yellow, orange, red, pink,
# purple or graphite; accent is its color (#RRGGBB). A color of your own in
# accent (without accent_name) is used by SDE, and GTK uses the nearest one.
#accent_name=blue
accent=#3684DD
# Icon theme name, or "auto": Papirus (Papirus-Dark in dark mode) when it is
# installed, otherwise the best installed theme.
icon_theme=auto
font=Sans
font_size=10
# Interface size in percent (100, 125, 150, 175, 200) or "auto" (from Xft.dpi).
scale=auto
# Path to an image (JPEG, PNG, SVG, or WebP when gdk-pixbuf can read it), or
# "auto" for the Selviana wallpaper that follows light and dark mode.
wallpaper=auto
# zoom, fit, stretch, center or tile
wallpaper_mode=zoom

[aero]
# Translucency: Acrylic/vibrancy for the panel and menus of every family;
# SDE Glass also makes window frames translucent and adds blur.
# The compositor must be running ([compositor] mode=auto).
enabled=true
# Transparency in percent, 0 (opaque) to 60.
transparency=18
blur=true
# Blur strength, 1 (light) to 12 (strong).
blur_strength=6
rounded_corners=true
# Fade windows and menus in and out.
animations=true

[menu]
# Right-click the Start menu to change these.
# top or bottom
search_position=top
# left, right or hidden
categories=left
# list or grid
view=list
show_descriptions=true
# small, medium or large (all slim; small screens get what fits)
size=medium
# "Recently used" below the favorites: apps ranked by how often and how
# recently they were opened (kept in ~/.local/state/sde/menu-usage).
show_recent=true
# Up to 12 favorites, as desktop IDs separated by ";" (right-click an app in
# the menu to add or remove one). Unset: a sensible default set.
#favorites=

[effects]
# auto enables menu animations on computers with 4 GB memory and 4 CPU
# threads (Eduka-Desktop's rule); true or false forces them.
enabled=auto
# none, wave, glow, slide, pop or bounce
hover=pop
# none, zoom, zoom-out, ripple, bounce, bubbles, confetti or fade
launch=zoom
# slow, normal or fast; small, normal or large
speed=normal
size=normal
random=false

[panel]
# full, floating or short (centered); widths are percentages of the monitor.
style=full
width_percent=96
# bottom or top
position=bottom
height=40
autohide=false
clock_24h=true
show_date=true
# A thin Show Desktop strip next to the Action Center button (Super+D works always).
show_desktop_button=false
show_battery=true
show_keyboard=true
show_bluetooth=true
# A power button in the tray (the Action Center and Start menu also have one).
show_power=false
# Shown while a USB drive or memory card is plugged in / while Do Not Disturb is on.
show_drives=true
show_do_not_disturb=true
show_media=true
show_network=true
show_sound=true
show_tray=true
# Application tray icons sit directly on the panel while there are at most
# tray_overflow_threshold of them and they fit; more gather behind the ^
# overflow button. tray_overflow: auto, always or never.
tray_overflow=auto
tray_overflow_threshold=4
# Applets that keep running as agents but would repeat a native indicator
# (network, Bluetooth, battery, volume). Matched against SNI Id/Title and the
# XEmbed WM_CLASS. Set hide_duplicate_tray=false to show them anyway.
hide_duplicate_tray=true
duplicate_tray_items=nm-applet;blueman;blueman-applet;pasystray;volumeicon;cbatticon;nm-tray
# Applications pinned to the panel (desktop file IDs). Missing ones are skipped.
pinned=org.mozilla.firefox.desktop;firefox.desktop;firefox-esr.desktop;chromium.desktop;liria.desktop;niny.desktop;sde-settings.desktop

[desktop]
# small, medium or large
icon_size=medium
# name, size, type or modified
sort=name
show_icons=true
show_computer=false
show_home=true
show_trash=false

[suite]
# auto uses the SDE theme chosen in Settings (SDE-Graphite-Light-Blue, ...)
# and follows SDE's light/dark mode and accent in GTK suite processes.
# system keeps the system GTK theme. An explicit GTK_THEME always wins.
gtk_theme=auto

[action_center]
show_clock=true
clock_style=digital
show_greeting=true
multicolor=false
# The tray flyout (the ^ icon) gathers the panel's tray icons while it is open.
move_status=true
# Expanded shows media, calendar and notifications; false keeps tiles and
# sliders only. The header button of the Action Center switches it.
expanded=true
show_calendar=true
show_notifications=true
show_media=true
show_app_volume=true
show_microphone=true
show_tray=true
# Quick tiles per row: 4 (default) or 3.
tile_columns=4

[notifications]
do_not_disturb=false
# Seconds a notification stays on screen; 0 keeps it until dismissed.
timeout=6

[input]
# Keyboard layout codes from XKB, e.g. us, id, de. Empty keeps the system setting.
keyboard_layout=
keyboard_layout2=
repeat_delay=500
repeat_rate=30
# -100 (slow) to 100 (fast)
mouse_speed=0
mouse_natural_scroll=false
touchpad_tap=true
touchpad_natural_scroll=true
touchpad_disable_while_typing=true
touchpad_speed=0

[session]
# Window manager command. sde-wm is built from Openbox source for SDE.
window_manager=sde-wm
# Polkit authentication agent command, "auto" or "none".
polkit_agent=auto

[compositor]
# off disables compositing; auto starts the optional supervised SDE compositor.
mode=auto
# auto uses OpenGL (glx) on a real GPU, and xrender in virtual machines,
# with software rendering (llvmpipe) or without a DRM graphics device.
# Alt+Shift+F12 turns the compositor off or on.
backend=auto
# auto: full effects (blur, rounded corners, fades) on a real GPU, lite
# (shadows and translucency only) in VMs and with software rendering, and
# full when backend is set by hand. full or lite force a profile.
effects=auto
# vsync and unredirecting fullscreen windows default to on for a real GPU
# and off in VMs/software rendering. Uncomment to force:
#vsync=true
#unredirect_fullscreen=true

[update]
# SDE Update background checks (sde-update --notifier, started at login).
# Hours between checks: 0 (never), 1, 6, 12, 24 or 168. Nothing is ever
# installed automatically.
check_interval=24
# Refresh the package lists through PackageKit before each check.
auto_refresh=true
# Show a notification when updates are available.
notify=true
notify_security_only=false

[power]
# SDE Power (sde-power --daemon). Idle timeouts in seconds, 0 = never,
# separately on battery and when plugged in (AC). Programs that inhibit
# the screen saver (videos, presentations) pause them.
idle_dim_battery=120
idle_blank_battery=300
idle_suspend_battery=900
idle_dim_ac=300
idle_blank_ac=600
idle_suspend_ac=0
# Brightness while dimmed, in percent of the current brightness.
dim_level=30
# Lid on battery / on AC, and the power button:
#   suspend, hibernate, lock, blank (screen off), nothing, poweroff,
#   interactive (power button only: ask), logind (leave it to systemd-logind)
lid_battery=suspend
lid_ac=suspend
power_button=interactive
# Battery warnings (percent) and the critical action:
# hibernate (shuts down when hibernation is unavailable), suspend, poweroff, nothing
notify_battery=true
battery_low=10
battery_critical=5
critical_action=hibernate
# power-profiles-daemon mode on battery / on AC (power-saver, balanced,
# performance); empty leaves the mode alone.
profile_battery=
profile_ac=
# Brightness keys: step in percent and the on-screen display.
brightness_step=5
show_osd=true

[lock]
# SDE Screen Lock (sde-lock --daemon). Lock after this many idle seconds
# (0 = never), unless a program inhibits the screen saver.
idle_lock=300
# Lock before suspend and hibernate (logind delay inhibitor).
lock_on_suspend=true
# Turn the monitors off after this many seconds on the lock screen (0 = never).
blank_after=30
# "Switch User" button with LightDM (dm-tool).
show_switch_user=true
