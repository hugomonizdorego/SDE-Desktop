# LightDM for SDE-Desktop (package sde-desktop, docs/PACKAGING.md): Slick
# Greeter, SDE-Desktop for accounts without a session of their own, the
# list of users without a manual login entry and without a guest session.
#
# LightDM reads this after Debian's defaults (01_debian.conf hides the users)
# and the greeters' own drop-ins in /usr/share/lightdm/lightdm.conf.d, and
# before /etc/lightdm/lightdm.conf.d/*.conf and /etc/lightdm/lightdm.conf:
# set any key there (Login Window, lightdm-settings, saves its choices in
# /etc/lightdm/lightdm.conf). Automatic login is not set here: a Debian live
# system's live-config writes autologin-user to /etc/lightdm/lightdm.conf,
# and the live user then starts SDE-Desktop directly; installed systems show
# the greeter. Slick Greeter's look is in 40_sde-desktop.gschema.override.
[Seat:*]
greeter-session=slick-greeter
user-session=sde-desktop
greeter-hide-users=false
greeter-show-manual-login=false
allow-guest=false
