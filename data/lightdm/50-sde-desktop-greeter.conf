# LightDM GTK Greeter look for the SDE-Desktop session (SDE Graphite), with the login
# artwork of whatever desktop-base theme the distribution made active (on DebION
# GNU/Linux that is the DebION theme from debion-desktop-base).
# Override any key in /etc/lightdm/lightdm-gtk-greeter.conf.
[greeter]
theme-name=SDE-Graphite-Dark-Blue
icon-theme-name=Papirus-Dark
font-name=Sans 10
background=/usr/share/desktop-base/active-theme/login/background.svg
user-background=true
default-user-image=#avatar-default
clock-format=%A, %d %B  %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~language;~a11y;~power
position=50%,center 50%,center
