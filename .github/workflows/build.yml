name: Build Debian packages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs read the repository; only "publish" writes.
permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --locked --offline
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.59.0 --profile minimal
          cargo +1.59.0 test --workspace --locked --offline

  deb:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:testing"]
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history: the build number in Control Center > About
          # counts the commits (tools/build-info.py).
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sh tools/install-deps.sh
          sh tools/install-native-deps.sh
      - name: Artifact name
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=sde-$(printf '%s' "$IMAGE" | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: sh tools/build-deb.sh dist
      - name: Install and smoke test
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/sde_*.deb ./dist/merkadu_*.deb
          for p in sde-display-settings calculator sde-wm sde-compositor sde-session sde-panel sde-desktop sde-notifyd sde-settings sde-run sde-logout sde-autostart sde-suite sde-update merkadu; do
            "$p" --version
          done
          # SDE's own ecosystem: no distribution FLTK, xsettingsd or polkit agent.
          test -x /usr/bin/sde-xsettingsd && test -x /usr/libexec/sde/sde-polkit-agent
          ! ldd /usr/bin/sde-panel | grep -q libfltk
          python3 tools/test-suite.py
          python3 tools/check-installed-suite.py
          /usr/bin/python3 /usr/share/sde/update/check.py > /tmp/sde-update-cache.tsv
          head -n 1 /tmp/sde-update-cache.tsv | grep -F 'SDE-UPDATES'
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/debion-desktop-base_*.deb
          test "$(readlink -f /usr/share/desktop-base/active-theme)" = /usr/share/desktop-base/debion-theme
          test "$(readlink -f /usr/share/images/vendor-logos)" = /usr/share/desktop-base/debion-logos
          test -s /usr/share/plymouth/themes/debion/debion.script
          DEBIAN_FRONTEND=noninteractive apt-get install --simulate --no-install-recommends ./dist/sde-desktop_*.deb ./dist/debion-desktop-base_*.deb
      - name: Native UI smoke checks
        if: matrix.image == 'debian:testing'
        run: |
          apt-get install -y --no-install-recommends python3 xvfb xdotool imagemagick dbus-x11 libnotify-bin libglib2.0-bin dconf-gsettings-backend adwaita-icon-theme
          # The About windows of the installed programs (tests/test_about_ui.py
          # is skipped in the package build, which has no display).
          dbus-run-session -- python3 tests/test_about_ui.py niny=/usr/bin/niny \
            sysmon=/usr/bin/sde-system-monitor run=/usr/bin/sde-run display=/usr/bin/sde-display-settings \
            calculator=/usr/bin/calculator welcome=/usr/bin/sde-welcome reports=/usr/bin/sde-system-reports \
            merkadu=/usr/bin/merkadu licenses=dist/test-tools/sde-ui-kit-demo
          # Niny: each tab's × closes its tab, the only tab stays, the menu bar.
          python3 tests/test_niny_ui.py /usr/bin/niny
          dbus-run-session -- python3 tools/panel-smoke.py --test-dir dist/test-tools --output-dir dist/panel-smoke
          dbus-run-session -- python3 tools/panel-smoke.py --test-dir dist/test-tools --size 1024x600 --scale 150 --output-dir dist/panel-smoke-small
          dbus-run-session -- python3 tools/ui-smoke.py --suite-apps --output-dir dist/ui-smoke
          dbus-run-session -- python3 tools/ui-smoke.py --size 1024x600 --scale 150 --output-dir dist/ui-smoke-small
      - uses: actions/upload-artifact@v7
        if: always() && matrix.image == 'debian:testing'
        with:
          name: sde-ui-smoke
          path: |
            dist/ui-smoke*/
            dist/panel-smoke*/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/*.deb
            dist/*sources*.tar.xz
            dist/*.sha256
      # Screenshots of everything for the development update (tools/showcase.py):
      # the installed packages in a private Xvfb session with sample content.
      # Papirus as on a desktop install (Recommends), nss_wrapper for the
      # sample account's name. A screenshot problem never fails the build.
      - name: Showcase screenshots
        if: matrix.image == 'debian:testing'
        continue-on-error: true
        timeout-minutes: 35
        run: |
          apt-get install -y --no-install-recommends papirus-icon-theme libnss-wrapper tzdata || true
          python3 tools/showcase.py --test-dir dist/test-tools --output-dir dist/showcase \
            --zip "dist/sde-screenshots_$(tr '~' '.' < VERSION).zip"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.image == 'debian:testing'
        with:
          name: sde-showcase
          if-no-files-found: ignore
          path: |
            dist/showcase/
            dist/sde-screenshots_*.zip

  # Keeps GitHub current after every successful build of main (or a manual
  # run): a rolling "alpha-latest" pre-release with the Debian packages and
  # sources, and the screenshot gallery in docs/screenshots/latest.
  publish:
    name: Publish alpha-latest and screenshots
    needs: deb
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-alpha-latest
      cancel-in-progress: false
    steps:
      # Credentials stay: the screenshot step pushes to this branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: sde-debian-testing
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: sde-ui-smoke
          path: smoke
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sde-showcase
          path: showcase
      - name: Rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(cat VERSION)
          cd packages
          sha256sum ./*.deb ./*.tar.xz > SHA256SUMS
          cd ..
          {
            echo "Automatic build of \`$GITHUB_SHA\` (SDE $version, Debian testing, amd64)."
            echo
            echo "This is alpha software for testing. Install the packages with:"
            echo
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS --ignore-missing'
            echo 'sudo apt install ./sde_*.deb ./sde-desktop_*.deb ./merkadu_*.deb'
            echo '# DebION GNU/Linux integration (optional, a separate project):'
            echo 'sudo apt install ./debion-desktop-base_*.deb'
            echo '```'
            echo
            echo "Then choose **SDE-Desktop** at the login screen."
            echo "Screenshots: docs/screenshots/latest/README.md"
          } > notes.md
          # The showcase (tools/showcase.py) as one zip; "~" becomes "." like
          # GitHub does for the other assets.
          shots="showcase/sde-screenshots_$(echo "$version" | tr '~' '.').zip"
          if [ -f "$shots" ]; then
            echo "Development screenshots of everything: \`$(basename "$shots")\` (README.md and contact sheets inside)." >> notes.md
          else
            shots=""
          fi
          gh release delete alpha-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create alpha-latest packages/*.deb packages/*.tar.xz packages/SHA256SUMS ${shots:+"$shots"} \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "SDE $version (latest alpha build)" --notes-file notes.md
      - name: Update the screenshot gallery
        continue-on-error: true
        run: |
          set -eu
          dest=docs/screenshots/latest
          rm -rf "$dest" && mkdir -p "$dest"
          pick() { [ -f "smoke/$1" ] && convert "smoke/$1" -strip -define png:compression-level=9 "$dest/$2" || true; }
          sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          pick ui-smoke/01-action-center-light.png 01-action-center.png
          pick ui-smoke/05-action-center-dark.png 02-action-center-dark.png
          pick ui-smoke/00-start-menu.png 03-start-menu.png
          pick ui-smoke/02-settings-overview.png 04-settings.png
          pick ui-smoke/10-engine-liria.png 05-liria.png
          pick ui-smoke/10-engine-niny.png 06-niny.png
          pick ui-smoke/10-engine-sde-view.png 07-photo.png
          pick ui-smoke/10-engine-photo-effects.png 08-photo-effects.png
          pick ui-smoke/10-engine-xanara.png 09-xanara.png
          pick ui-smoke/10-engine-taca.png 10-taca.png
          pick ui-smoke/11-calculator-native.png 11-calculator.png
          pick ui-smoke/09-update.png 12-update.png
          pick panel-smoke/01-action-center.png 13-panel-tray.png
          {
            echo "# Latest SDE screenshots"
            echo
            echo "Captured automatically by CI from the native programs on a virtual X11"
            echo "display (commit \`$GITHUB_SHA\`). Network, sound and Bluetooth values are test fixtures."
            echo
            for f in "$dest"/*.png; do
              b=$(basename "$f"); echo "![${b%.png}]($b)"; echo
            done
          } > "$dest/README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update latest screenshots [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
