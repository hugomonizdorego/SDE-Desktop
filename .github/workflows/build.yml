name: Build Debian packages

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          cargo test --workspace --locked --offline
      - name: Check minimum Rust version
        run: |
          rustup toolchain install 1.59.0 --profile minimal
          cargo +1.59.0 test --workspace --locked --offline

  deb:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:testing"]
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sh tools/install-deps.sh
          sh tools/install-native-deps.sh
          apt-get install -y --no-install-recommends sudo
      - name: Artifact name
        id: name
        run: echo "name=sde-$(echo '${{ matrix.image }}' | tr ':' '-')" >> "$GITHUB_OUTPUT"
      - name: Build package
        run: sh tools/build-deb.sh dist
      - name: Install and smoke test
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./dist/sde_*.deb
          for p in calculator sde-wm sde-compositor sde-session sde-panel sde-desktop sde-notifyd sde-settings sde-run sde-logout sde-autostart sde-suite sde-update; do
            "$p" --version
          done
          python3 tools/test-suite.py
          python3 tools/check-installed-suite.py
          /usr/bin/python3 /usr/share/sde/update/check.py > /tmp/sde-update-cache.tsv
          head -n 1 /tmp/sde-update-cache.tsv | grep -F 'SDE-UPDATES'
          DEBIAN_FRONTEND=noninteractive apt-get install --simulate --no-install-recommends ./dist/sde-desktop_*.deb
      - name: Native UI smoke checks
        if: matrix.image == 'debian:testing'
        run: |
          apt-get install -y --no-install-recommends python3 xvfb xdotool imagemagick dbus-x11 dconf-gsettings-backend adwaita-icon-theme sudo
          dbus-run-session -- python3 tools/ui-smoke.py --suite-apps --output-dir dist/ui-smoke
          dbus-run-session -- python3 tools/ui-smoke.py --size 1024x600 --scale 150 --output-dir dist/ui-smoke-small
      - uses: actions/upload-artifact@v4
        if: always() && matrix.image == 'debian:testing'
        with:
          name: sde-ui-smoke
          path: dist/ui-smoke*/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            dist/*.deb
            dist/*sources*.tar.xz
            dist/*.sha256
