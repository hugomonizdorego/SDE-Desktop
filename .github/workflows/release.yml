name: Release

# Publishes a GitHub release with one .deb per distribution, SHA256SUMS and
# the matching CHANGELOG.md section. Start it by pushing a tag such as
# v0.1.0-alpha2, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release for (e.g. v0.1.0-alpha2)"
        required: true

# Least privilege: building only reads; the release job writes.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: "debian:testing", name: debian-testing, suffix: debtesting }
    container: ${{ matrix.image }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sh tools/install-deps.sh
          sh tools/install-native-deps.sh
      - name: Build package
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: sh tools/build-deb.sh --suffix "$SUFFIX" dist
      - name: Install and smoke test
        run: |
          # SDE Core, the applications and the transitional sde (docs/PACKAGING.md).
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            $(ls ./dist/*.deb | grep -v -e '-dbgsym_' -e '/sde-desktop_' -e '/debion-desktop-base_')
          for p in sde-session sde-panel sde-desktop sde-notifyd sde-settings sde-run sde-logout sde-autostart sde-suite sde-update; do
            "$p" --version
          done
          python3 tools/test-suite.py
          python3 tools/check-installed-suite.py
          apt-get install --simulate --no-install-recommends ./dist/sde-desktop_*.deb
      - name: Name the package after the distribution
        env:
          DISTRO: ${{ matrix.name }}
        run: |
          version=$(cat VERSION | tr '~' '-')
          mkdir -p out
          # Every package (sde-core, the applications, sde-desktop, sde,
          # debion-desktop-base and the -dbgsym debug symbols).
          for f in dist/*.deb; do
            b=$(basename "$f" .deb)
            cp "$f" "out/${b%%_*}_${version}_${DISTRO}_${b##*_}.deb"
          done
          cp dist/*sources*.tar.xz out/
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.name }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          cd artifacts
          sha256sum *.deb *.tar.xz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # The newest section of CHANGELOG.md.
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| Distribution | Package |"
            echo "| --- | --- |"
            for f in artifacts/*.deb; do
              b=$(basename "$f")
              d=$(echo "$b" | sed -E 's/^[^_]+_[^_]+_([^_]+)_(amd64|all)\.deb$/\1/')
              echo "| $d | \`$b\` |"
            done
            echo
            echo "Download the packages of your distribution without \`-dbgsym\` (debug symbols) and \`debion-desktop-base\` (DebION only) into an empty folder, install them with \`sudo apt install ./*.deb\` and choose **SDE-Desktop** at the login screen."
            echo "Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/*.deb artifacts/*.tar.xz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SDE $TAG" --notes-file notes.md --prerelease
